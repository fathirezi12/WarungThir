<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kasir - FATHIRPOS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f6fa;
}

header{
background:#16a34a;
color:white;
padding:20px;
text-align:center;
border-radius:0 0 25px 25px;
}

.container{
padding:20px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
margin:15px 0;
font-size:16px;
}

#produkList{
display:grid;
gap:15px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:10px;
}

.card p{
margin:5px 0;
}

button{
width:100%;
padding:12px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
margin-top:10px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#15803d;
}

.total{
margin-top:20px;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.total h2{
color:#16a34a;
margin-bottom:10px;
}

</style>
</head>

<body>

<header>

<h1>🛒 KASIR FATHIRPOS</h1>

<p>Transaksi Cepat & Mudah</p>

</header>

<div class="container">

<input
type="text"
id="cari"
placeholder="Cari produk..."
onkeyup="cariProduk()">

<div id="produkList"></div>

<div class="total">

<h2>Total Belanja</h2>

<h1 id="total">Rp0</h1>

<button onclick="bayar()">

💵 Bayar

</button>

</div>

</div>

<script>

let keranjang=[];

let produk=
JSON.parse(localStorage.getItem("produk"))||[];

function tampilProduk(){

let html="";

produk.forEach((item,index)=>{

html+=`

<div class="card">

<h3>${item.nama}</h3>

<p>Harga : Rp${item.harga.toLocaleString("id-ID")}</p>

<p>Stok : ${item.stok}</p>

<button onclick="tambah(${index})">

Tambah

</button>

</div>

`;

});

document.getElementById("produkList").innerHTML=html;

}

tampilProduk();
    function tambah(index){

keranjang.push(produk[index]);

hitungTotal();

alert(produk[index].nama+" ditambahkan");

}

function hitungTotal(){

let total=0;

keranjang.forEach(item=>{

total+=item.harga;

});

document.getElementById("total").innerHTML=
"Rp"+total.toLocaleString("id-ID");

}

function cariProduk(){

let keyword=
document.getElementById("cari").value.toLowerCase();

let html="";

produk
.filter(item=>item.nama.toLowerCase().includes(keyword))
.forEach((item,index)=>{

html+=`

<div class="card">

<h3>${item.nama}</h3>

<p>Harga : Rp${item.harga.toLocaleString("id-ID")}</p>

<p>Stok : ${item.stok}</p>

<button onclick="tambah(${produk.indexOf(item)})">

Tambah

</button>

</div>

`;

});

document.getElementById("produkList").innerHTML=html;

}

function bayar(){

if(keranjang.length==0){

alert("Keranjang masih kosong!");

return;

}

let total=0;

keranjang.forEach(item=>{

total+=item.harga;

});

let uang=
Number(prompt("Uang Pembeli"));

if(uang<total){

alert("Uang kurang!");

return;

}

let kembali=
uang-total;

alert(

"Total : Rp"+total.toLocaleString("id-ID")+

"\nBayar : Rp"+uang.toLocaleString("id-ID")+

"\nKembalian : Rp"+kembali.toLocaleString("id-ID")

);

localStorage.setItem(
"omzet",
Number(localStorage.getItem("omzet")||0)+total
);

localStorage.setItem(
"transaksi",
Number(localStorage.getItem("transaksi")||0)+1
);

keranjang=[];

hitungTotal();

    </script>
</body>
</html>
}
