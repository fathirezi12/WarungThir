<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasir - FATHIRPOS</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f4f6;
padding:20px;
}

.card{
max-width:500px;
margin:auto;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

h1{
text-align:center;
color:#16a34a;
margin-bottom:25px;
}

select,
input{
width:100%;
padding:14px;
margin-top:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:17px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
background:#16a34a;
color:white;
}

button:hover{
opacity:.9;
}

.total{
margin-top:20px;
font-size:32px;
font-weight:bold;
text-align:center;
color:#16a34a;
}

.info{
margin-top:10px;
font-size:17px;
text-align:center;
color:#555;
}
</style>
</head>

<body>

<div class="card">

<h1>🛒 Kasir</h1>

<select id="produk"></select>

<input
type="number"
id="jumlah"
placeholder="Jumlah">

<button onclick="hitungTotal()">
💰 Hitung Total
</button>

<div class="total" id="total">
Rp0
</div>

<div class="info" id="stokInfo">
</div>

<button onclick="window.location.href='dashboard.html'">
⬅ Kembali
</button>

</div>

<script>

let daftarProduk=[];

function loadProduk(){

daftarProduk=
JSON.parse(localStorage.getItem("produk"))||[];

let select=document.getElementById("produk");

select.innerHTML="";

daftarProduk.forEach((p,i)=>{

select.innerHTML+=`
<option value="${i}">
${p.nama} - Rp${p.harga.toLocaleString("id-ID")}
</option>
`;

});

tampilStok();

}

function tampilStok(){

let index=document.getElementById("produk").value;

if(index==="") return;

let p=daftarProduk[index];

document.getElementById("stokInfo").innerHTML=
"Stok tersedia : <b>"+p.stok+"</b>";

}

document.getElementById("produk").onchange=tampilStok;

function hitungTotal(){

let index=document.getElementById("produk").value;

let jumlah=Number(document.getElementById("jumlah").value);

if(jumlah<=0){

alert("Masukkan jumlah.");

return;

}

let p=daftarProduk[index];

if(jumlah>p.stok){

alert("Stok tidak cukup!");

return;

}

let total=p.harga*jumlah;

document.getElementById("total").innerHTML=
"Rp"+total.toLocaleString("id-ID");

}

loadProduk();

</script>

</body>
</html>
