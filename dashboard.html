<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FATHIRPOS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f6f9;
}

.header{

background:linear-gradient(135deg,#16a34a,#22c55e);

padding:30px 20px 90px;

color:white;

border-radius:0 0 30px 30px;

}

.header h1{

font-size:28px;

margin-bottom:5px;

}

.header p{

opacity:.9;

}

.content{

margin-top:-60px;

padding:15px;

}

.card{

background:white;

border-radius:20px;

padding:20px;

box-shadow:0 8px 20px rgba(0,0,0,.08);

margin-bottom:18px;

}

.grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:15px;

}

.stat{

background:#f9fafb;

padding:15px;

border-radius:15px;

text-align:center;

}

.stat h2{

color:#16a34a;

font-size:26px;

margin-top:8px;

}

.menu{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;

margin-top:15px;

}

.menu a{

text-decoration:none;

background:white;

border-radius:18px;

padding:18px 10px;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,.08);

color:#222;

font-size:14px;

font-weight:600;

}

.icon{

font-size:32px;

display:block;

margin-bottom:8px;

}

</style>

</head>

<body>

<div class="header">

<h1>👋 Halo Admin</h1>

<p id="tanggal"></p>

</div>

<div class="content">

<div class="card">

<div class="grid">

<div class="stat">

💰

<h2 id="omzet">Rp0</h2>

<small>Omzet</small>

</div>

<div class="stat">

📦

<h2 id="produk">0</h2>

<small>Produk</small>

</div>

<div class="stat">

🧾

<h2 id="trx">0</h2>

<small>Transaksi</small>

</div>

<div class="stat">

⚠️

<h2 id="stok">0</h2>

<small>Stok Tipis</small>

</div>

</div>

</div>
<div class="card">

<h3 style="margin-bottom:15px;">🚀 Menu Utama</h3>

<div class="menu">

<a href="kasir.html">
<span class="icon">🛒</span>
Kasir
</a>

<a href="produk.html">
<span class="icon">📦</span>
Produk
</a>

<a href="laporan.html">
<span class="icon">📊</span>
Laporan
</a>

<a href="#">
<span class="icon">👥</span>
Pelanggan
</a>

<a href="#">
<span class="icon">⚙️</span>
Pengaturan
</a>

<a href="#">
<span class="icon">💾</span>
Backup
</a>

</div>

</div>

<div class="card">

<h3>📈 Aktivitas Hari Ini</h3>

<p style="margin-top:10px;color:#666;">
Belum ada transaksi hari ini.
</p>

</div>

</div>

<script>

const produk =
JSON.parse(localStorage.getItem("produk")) || [];

document.getElementById("produk").innerHTML =
produk.length;

let stokTipis = produk.filter(p => p.stok <= 5).length;

document.getElementById("stok").innerHTML =
stokTipis;

document.getElementById("omzet").innerHTML =
"Rp" + Number(localStorage.getItem("omzet") || 0)
.toLocaleString("id-ID");

document.getElementById("trx").innerHTML =
localStorage.getItem("transaksi") || 0;

document.getElementById("tanggal").innerHTML =
new Date().toLocaleDateString("id-ID",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

</script>

</body>
</html>
