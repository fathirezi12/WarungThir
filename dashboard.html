<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard FATHIRPOS</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f3f4f6;
        }

        header{
            background:#16a34a;
            color:white;
            padding:20px;
            text-align:center;
            font-size:24px;
            font-weight:bold;
        }

        .container{
            padding:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:15px;
            margin-bottom:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .card h2{
            color:#16a34a;
            margin-bottom:10px;
        }

        button{
            width:100%;
            padding:15px;
            background:#16a34a;
            color:white;
            border:none;
            border-radius:10px;
            font-size:18px;
            margin-top:10px;
        }
    </style>
</head>

<body>

<header>
    FATHIRPOS
</header>

<div class="container">

    <div class="card">
        <h2>💰 Omzet Hari Ini</h2>
        <h1>Rp0</h1>
    </div>

    <div class="card">
        <h2>📦 Total Produk</h2>
        <h1 id="totalProduk">0 Produk</h1>
    </div>

    <div class="card">
        <button onclick="tambahBarang()">
    ➕ Tambah Barang
            <button onclick="window.location.href='produk.html'">
📦 Daftar Produk
            </button>
        </button>
        <button onclick="alert('Fitur segera hadir')">
            🧾 Transaksi Baru
        </button>
    </div>

</div>

<script>
function tambahBarang() {

    let nama = prompt("Nama Barang:");
    if (!nama) return;

    let harga = prompt("Harga Barang:");
    if (!harga) return;

    let stok = prompt("Stok Barang:");
    if (!stok) return;

    let produk = JSON.parse(localStorage.getItem("produk")) || [];

    produk.push({
        nama: nama,
        harga: Number(harga),
        stok: Number(stok)
    });

    localStorage.setItem("produk", JSON.stringify(produk));

    alert("Barang berhasil ditambahkan!");

    tampilProduk();
}

function tampilProduk(){

    let produk = JSON.parse(localStorage.getItem("produk")) || [];

    document.getElementById("totalProduk").innerHTML =
        produk.length + " Produk";
}

window.onload = tampilProduk;
</script></body>
</html>
