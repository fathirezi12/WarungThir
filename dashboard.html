<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard FATHIRPOS</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f3f4f6;
        }

        header{
    background:#16a34a;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:30px;
    margin-bottom:5px;
}

header p{
    opacity:0.9;
    font-size:15px;
}

        .container{
            padding:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:15px;
            margin-bottom:15px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
        }

        .card h2{
            color:#16a34a;
            margin-bottom:10px;
        }

        button{
            width:100%;
            padding:15px;
            background:#16a34a;
            color:white;
            border:none;
            border-radius:10px;
            font-size:18px;
            margin-top:10px;
        }
        .stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:white;
    padding:18px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    text-align:center;
}

.stat-card h3{
    color:#666;
    font-size:15px;
    margin-bottom:10px;
}

.stat-card h1{
    color:#16a34a;
    font-size:28px;
}

.menu-title{
    margin:20px 0 10px;
    font-size:18px;
    font-weight:bold;
}
   .stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat-card{
    background:white;
    border-radius:15px;
    padding:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    text-align:center;
}

.stat-card h3{
    color:#666;
    font-size:15px;
    margin-bottom:8px;
}

.stat-card h2{
    color:#16a34a;
    font-size:26px;
} </style>
</head>

<body>

<header>
    <h1>👋 Halo, Admin</h1>
<p id="tanggal"></p>
</header>

<div class="container">
    <div class="stats">

    <div class="stat-card">
        <h3>Total Produk</h3>
        <h2 id="totalProduk">0</h2>
    </div>

    <div class="stat-card">
        <h3>Omzet Hari Ini</h3>
        <h2>Rp0</h2>
    </div>

    <div class="stat-card">
        <h3>Transaksi</h3>
        <h2>0</h2>
    </div>

    <div class="stat-card">
        <h3>Stok Menipis</h3>
        <h2>0</h2>
    </div>

    </div>

    <div class="card">
        <h2>💰 Omzet Hari Ini</h2>
        <h1>Rp0</h1>
    </div>

    <div class="card">
        <h2>📦 Total Produk</h2>
        <h1 id="totalProduk">0 Produk</h1>
    </div>

    <div class="card">
        <button onclick="tambahBarang()">
    ➕ Tambah Barang
</button>

<button onclick="window.location.href='produk.html'">
    📦 Daftar Produk
</button>

<button onclick="window.location.href='kasir.html'">
    🧾 Kasir
</button>

<button onclick="window.location.href='laporan.html'">
    📊 Laporan
</button>

<button onclick="window.location.href='pengaturan.html'">
    ⚙️ Pengaturan
</button>
    </div>

</div>

<script>
function tambahBarang() {

    let nama = prompt("Nama Barang:");
    if (!nama) return;

    let harga = prompt("Harga Barang:");
    if (!harga) return;

    let stok = prompt("Stok Barang:");
    if (!stok) return;

    let produk = JSON.parse(localStorage.getItem("produk")) || [];

    produk.push({
        nama: nama,
        harga: Number(harga),
        stok: Number(stok)
    });

    localStorage.setItem("produk", JSON.stringify(produk));

    alert("Barang berhasil ditambahkan!");

    tampilProduk();
}

function tampilProduk(){

    let produk = JSON.parse(localStorage.getItem("produk")) || [];

    document.getElementById("totalProduk").innerHTML =
        produk.length + " Produk";
}

window.onload = tampilProduk;
const hari = new Date();

document.getElementById("tanggal").innerHTML =
hari.toLocaleDateString("id-ID", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
});</script></body>
</html>
