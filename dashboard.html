<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FATHIRPOS Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
color:#222;
}

header{
background:linear-gradient(135deg,#16a34a,#22c55e);
color:white;
padding:30px 20px;
border-radius:0 0 30px 30px;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

header h1{
font-size:32px;
margin-bottom:8px;
}

header p{
opacity:.9;
font-size:15px;
}

.container{
padding:20px;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-bottom:20px;
}

.stat-card{
background:white;
padding:18px;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
text-align:center;
transition:.3s;
}

.stat-card:hover{
transform:translateY(-5px);
}

.stat-card h3{
font-size:14px;
color:#777;
margin-bottom:10px;
}

.stat-card h2{
color:#16a34a;
font-size:28px;
}

.menu{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.menu button{
background:white;
border:none;
border-radius:20px;
padding:25px 15px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.menu button:hover{
background:#16a34a;
color:white;
transform:scale(1.03);
}

.footer{
margin-top:30px;
text-align:center;
color:#888;
font-size:13px;
padding-bottom:20px;
}

@media(max-width:600px){

header h1{
font-size:28px;
}

.menu button{
padding:20px 10px;
font-size:16px;
}

}

</style>
</head>

<body>

<header>

<h1>👋 Halo, Admin</h1>

<p id="tanggal"></p>

</header>

<div class="container">

<div class="stats">

<div class="stat-card">
<h3>💰 Omzet Hari Ini</h3>
<h2 id="omzet">Rp0</h2>
</div>

<div class="stat-card">
<h3>📦 Produk</h3>
<h2 id="produk">0</h2>
</div>

<div class="stat-card">
<h3>🧾 Transaksi</h3>
<h2 id="transaksi">0</h2>
</div>

<div class="stat-card">
<h3>⚠️ Stok Menipis</h3>
<h2 id="stok">0</h2>
</div>

</div>
<div class="menu">

<button onclick="window.location.href='kasir.html'">
🛒<br><br>Kasir
</button>

<button onclick="window.location.href='produk.html'">
📦<br><br>Produk
</button>

<button onclick="window.location.href='laporan.html'">
📊<br><br>Laporan
</button>

<button onclick="window.location.href='pelanggan.html'">
👤<br><br>Pelanggan
</button>

<button onclick="window.location.href='pengaturan.html'">
⚙️<br><br>Pengaturan
</button>

<button onclick="backupData()">
💾<br><br>Backup
</button>

</div>

<div class="footer">
FATHIRPOS Premium v1.0
</div>

</div>

<script>

function loadDashboard(){

let daftarProduk =
JSON.parse(localStorage.getItem("produk")) || [];

document.getElementById("produk").innerHTML =
daftarProduk.length;

document.getElementById("transaksi").innerHTML =
localStorage.getItem("transaksi") || 0;

let stokMenipis = 0;

daftarProduk.forEach(item=>{
if(item.stok<=5){
stokMenipis++;
}
});

document.getElementById("stok").innerHTML =
stokMenipis;

}

function backupData(){

alert("Fitur Backup segera hadir 🚀");

}

const hari = new Date();

document.getElementById("tanggal").innerHTML =
hari.toLocaleDateString("id-ID",{

weekday:"long",
day:"numeric",
month:"long",
year:"numeric"

});

window.onload = loadDashboard;
    function exportData(){

    let data = localStorage.getItem("produk");

    if(!data){
        alert("Belum ada data untuk diekspor.");
        return;
    }

    let blob = new Blob([data], {type:"application/json"});
    let url = URL.createObjectURL(blob);

    let a = document.createElement("a");
    a.href = url;
    a.download = "backup-fathirpos.json";
    a.click();

    URL.revokeObjectURL(url);
}

function importData(){

    let input = document.createElement("input");
    input.type = "file";
    input.accept = ".json";

    input.onchange = function(e){

        let file = e.target.files[0];

        let reader = new FileReader();

        reader.onload = function(){

            localStorage.setItem("produk", reader.result);

            alert("Backup berhasil dipulihkan ✅");

            loadDashboard();
        }

        reader.readAsText(file);

    }

    input.click();
}
    document.getElementById("omzet").innerHTML =
"Rp" + Number(localStorage.getItem("omzet") || 0)
.toLocaleString("id-ID");

</script>

</body>
</html>
